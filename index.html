<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#2D6A4F"/>
<title>ObraClara — Maternidade Porte I</title>
<link rel="manifest" href="manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#F8F6F1;--surface:#FFFFFF;--surface-hover:#F4F2ED;--border:#E5E1D8;
  --sidebar:#1A1A2E;--sidebar-hover:rgba(255,255,255,.08);
  --primary:#2D6A4F;--primary-dark:#1B4332;--primary-pale:#D8F3DC;
  --ok:#2D6A4F;--warn:#C77700;--warn-pale:#FFF3DC;--danger:#C1121F;--danger-pale:#FFECEB;
  --text:#1B1B1B;--text2:#4A4A4A;--text3:#8B8680;
  --font-display:'Playfair Display',serif;--font-body:'DM Sans',sans-serif;--font-mono:'JetBrains Mono',monospace;
  --sidebar-w:250px;--header-h:56px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);line-height:1.55;font-size:15px;overflow-x:hidden;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select{font-family:inherit;font-size:16px;}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh;}
.sidebar{position:fixed;top:0;left:0;height:100vh;width:var(--sidebar-w);background:var(--sidebar);color:#fff;display:flex;flex-direction:column;z-index:100;transition:transform .28s;}
.sidebar-logo{padding:20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.1);}
.sidebar-logo .icon{width:38px;height:38px;border-radius:11px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;}
.sidebar-logo h1{font-family:var(--font-display);font-size:18px;font-weight:700;line-height:1.15;}
.sidebar-logo p{font-size:10.5px;opacity:.55;}
.sidebar nav{flex:1;padding:14px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:10px;font-size:14.5px;font-weight:500;color:rgba(255,255,255,.72);transition:all .18s;}
.nav-item:hover{background:var(--sidebar-hover);color:#fff;}
.nav-item.active{background:var(--primary);color:#fff;font-weight:600;}
.nav-item svg{width:19px;height:19px;flex-shrink:0;}
.nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 6px;}
.sidebar-footer{padding:14px;border-top:1px solid rgba(255,255,255,.1);}
.sidebar-footer .sync{font-size:11.5px;color:rgba(255,255,255,.45);display:flex;align-items:center;gap:7px;}
.sidebar-footer .sync .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0;}
.main{flex:1;margin-left:var(--sidebar-w);display:flex;flex-direction:column;min-width:0;}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;}
.hamburger{display:none;align-items:center;justify-content:center;width:42px;height:42px;border-radius:9px;}
.hamburger svg{width:23px;height:23px;}

.header{height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 16px;position:sticky;top:0;z-index:40;}
.header-title{font-size:15px;font-weight:600;color:var(--text2);}

.content{padding:18px 16px 40px;max-width:840px;}
.page-title{font-family:var(--font-display);font-size:25px;font-weight:700;margin-bottom:3px;}
.page-sub{font-size:13.5px;color:var(--text3);margin-bottom:18px;}
.page-sub b{color:var(--text);font-weight:700;}

/* ---------- Hero (número grande) ---------- */
.hero{border-radius:16px;padding:22px 20px;margin-bottom:14px;color:#fff;}
.hero.pos{background:linear-gradient(135deg,var(--primary),var(--primary-dark));}
.hero.neg{background:linear-gradient(135deg,#C1121F,#8B0D16);}
.hero-label{font-size:12.5px;opacity:.82;font-weight:500;}
.hero-value{font-family:var(--font-mono);font-size:38px;font-weight:700;line-height:1.1;margin:6px 0 4px;letter-spacing:-.03em;}
.hero-note{font-size:12.5px;opacity:.78;}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:17px;}
.card-title{font-size:15.5px;font-weight:700;}
.hint{font-size:12.5px;color:var(--text3);line-height:1.5;margin-bottom:12px;}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.card.mini{padding:14px;cursor:pointer;transition:border-color .18s;}
.card.mini:hover{border-color:var(--primary);}
.card.mini.red{border-left:4px solid var(--danger);}
.card.mini.green{border-left:4px solid var(--primary);}
.mini-label{font-size:11.5px;color:var(--text3);font-weight:600;line-height:1.35;}
.mini-value{font-family:var(--font-mono);font-size:20px;font-weight:700;margin:5px 0 2px;letter-spacing:-.02em;}
.mini-note{font-size:11.5px;color:var(--text3);}

/* ---------- Linhas de valor ---------- */
.linha{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0;font-size:14px;}
.linha span{color:var(--text2);}
.linha b{font-family:var(--font-mono);font-weight:700;white-space:nowrap;}
.linha.destaque{border-top:1.5px solid var(--border);margin-top:6px;padding-top:12px;font-size:15.5px;}
.linha.destaque span{color:var(--text);font-weight:600;}
.linha.destaque b{font-size:17px;}

.frase{background:var(--primary-pale);color:#14342A;border-radius:12px;padding:14px 16px;font-size:14.5px;line-height:1.55;margin-bottom:14px;}
.frase b{font-weight:700;}

/* ---------- Contas (a pagar / a receber) ---------- */
.conta{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:12px;padding:14px 15px;margin-bottom:9px;display:flex;align-items:center;gap:12px;position:relative;}
.conta.vencida{border-left-color:var(--danger);background:#FFFCFC;}
.conta.vence{border-left-color:var(--warn);}
.conta.aberta{border-left-color:#C9C4B8;}
.conta.paga{border-left-color:var(--ok);opacity:.62;}
.conta-info{flex:1;min-width:0;}
.conta-desc{font-size:14.5px;font-weight:600;line-height:1.35;}
.conta-meta{font-size:12px;color:var(--text3);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.3px;}
.tag.vencida{background:var(--danger-pale);color:var(--danger);}
.tag.vence{background:var(--warn-pale);color:var(--warn);}
.tag.aberta{background:#EFEDE7;color:var(--text3);}
.tag.paga{background:var(--primary-pale);color:var(--ok);}
.conta-acao{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
.conta-valor{font-family:var(--font-mono);font-size:15.5px;font-weight:700;white-space:nowrap;}
.conta-valor.verde{color:var(--ok);}
.conta .btn-icon.del{position:absolute;top:6px;right:6px;opacity:0;transition:opacity .15s;}
.conta:hover .btn-icon.del{opacity:1;}

.mov{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
.mov:last-child{border-bottom:none;}
.mov-desc{font-size:14px;font-weight:500;}
.mov-data{font-size:12px;color:var(--text3);margin-top:1px;}
.mov-valor{font-family:var(--font-mono);font-size:14.5px;font-weight:700;white-space:nowrap;}
.mov-valor.in{color:var(--ok);}
.mov-valor.out{color:var(--text2);}

.lote{padding:9px 0;}
.lote:last-child{padding-bottom:0;}

/* ---------- Chips de filtro ---------- */
.chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.chip{padding:7px 15px;border-radius:99px;border:1.5px solid var(--border);background:var(--surface);font-size:13px;font-weight:600;color:var(--text3);}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff;}

/* ---------- Progress ---------- */
.progress-bar{height:9px;background:#EDEAE3;border-radius:99px;overflow:hidden;}
.progress-bar .fill{height:100%;border-radius:99px;transition:width .5s;}

/* ---------- Formulários ---------- */
.form-grid{display:grid;grid-template-columns:1fr;gap:11px;}
.form-grid.cols2{grid-template-columns:1fr 1fr;}
.fgroup{margin-bottom:11px;}
.fgroup label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px;}
.fgroup input,.fgroup select{width:100%;padding:12px 13px;border:1.5px solid var(--border);border-radius:10px;background:#FCFBF9;color:var(--text);}
.fgroup input:focus,.fgroup select:focus{outline:none;border-color:var(--primary);background:#fff;}

/* ---------- Botões ---------- */
.btn{padding:12px 18px;border-radius:10px;font-size:14px;font-weight:600;transition:all .18s;display:inline-flex;align-items:center;justify-content:center;gap:7px;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-outline{border:1.5px solid var(--primary);color:var(--primary);}
.btn-outline:hover{background:var(--primary-pale);}
.btn-danger-outline{border:1.5px solid var(--danger);color:var(--danger);}
.btn-sm{padding:8px 13px;font-size:13px;border-radius:8px;}
.btn-icon{padding:6px;border-radius:6px;color:var(--text3);display:inline-flex;}
.btn-icon:hover{color:var(--danger);}
.btn-link{font-size:12px;color:var(--text3);text-decoration:underline;}
.ok-line{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ok);font-weight:600;}

/* ---------- Alertas ---------- */
.alert{display:flex;gap:11px;padding:15px;border-radius:13px;border-left:4px solid var(--warn);background:var(--warn-pale);margin-bottom:14px;}
.alert.danger{border-left-color:var(--danger);background:var(--danger-pale);}
.alert svg{flex-shrink:0;margin-top:2px;}
.alert h3{font-size:14.5px;font-weight:700;margin-bottom:3px;}
.alert p{font-size:12.5px;color:var(--text2);line-height:1.5;}

.empty{display:flex;flex-direction:column;align-items:center;padding:30px 20px;color:var(--text3);text-align:center;}
.empty svg{width:34px;height:34px;margin-bottom:10px;opacity:.35;}
.empty p{font-size:13.5px;}

/* ---------- Simulador ---------- */
.slider{margin-bottom:18px;}
.slider .sl-head{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:8px;}
.slider .sl-head b{font-family:var(--font-mono);color:var(--primary);font-size:15px;}
.slider input[type=range]{width:100%;accent-color:var(--primary);height:26px;}
.sim-box{border-radius:12px;padding:16px;text-align:center;}
.sim-box.pos{background:var(--primary-pale);color:#14342A;}
.sim-box.neg{background:var(--danger-pale);color:#7A1015;}
.sim-label{font-size:12.5px;opacity:.8;font-weight:600;}
.sim-value{font-family:var(--font-mono);font-size:28px;font-weight:700;margin:3px 0;letter-spacing:-.02em;}
.sim-note{font-size:12px;opacity:.8;}
.sim-aviso{margin-top:10px;font-size:13px;color:var(--danger);font-weight:600;text-align:center;}
.sim-ok{margin-top:10px;font-size:13px;color:var(--ok);font-weight:600;text-align:center;}

/* ---------- Toast ---------- */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--text);color:#fff;padding:13px 22px;border-radius:99px;font-size:14px;font-weight:600;z-index:200;transition:transform .25s;box-shadow:0 8px 26px rgba(0,0,0,.22);}
#toast.show{transform:translateX(-50%) translateY(0);}

/* ---------- Entrada ---------- */
.gate{position:fixed;inset:0;background:var(--sidebar);display:flex;align-items:center;justify-content:center;z-index:500;padding:22px;}
.gate-box{background:var(--surface);border-radius:18px;padding:34px 28px;width:100%;max-width:340px;text-align:center;}
.gate-box .icon{width:56px;height:56px;border-radius:15px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;margin:0 auto 16px;font-size:19px;}
.gate-box h2{font-family:var(--font-display);font-size:21px;margin-bottom:4px;}
.gate-box p{font-size:13px;color:var(--text3);margin-bottom:20px;}
.gate-box input{width:100%;padding:14px;border:1.5px solid var(--border);border-radius:11px;text-align:center;font-size:22px;letter-spacing:8px;margin-bottom:12px;font-family:var(--font-mono);}
.gate-box input:focus{outline:none;border-color:var(--primary);}
.gate-box .btn{width:100%;}
.gate-box .err{color:var(--danger);font-size:13px;margin-bottom:10px;min-height:18px;font-weight:600;}

/* ---------- Responsivo ---------- */
@media(min-width:769px){
  .content{padding:26px 28px 60px;}
}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);width:270px;}
  .sidebar.open{transform:translateX(0);}
  .sidebar-overlay.open{display:block;}
  .hamburger{display:flex;}
  .main{margin-left:0;}
  .hero-value{font-size:33px;}
  .duo{grid-template-columns:1fr;}
  .form-grid.cols2{grid-template-columns:1fr 1fr;}
  .conta{flex-wrap:wrap;}
  .conta-acao{width:100%;flex-direction:row;justify-content:space-between;align-items:center;padding-top:4px;}
  .conta .btn-icon.del{opacity:.5;}
}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-box">
    <div class="icon">OC</div>
    <h2>ObraClara</h2>
    <p>Maternidade Porte I — equipe MSE</p>
    <div class="err" id="gateErr"></div>
    <input type="password" inputmode="numeric" maxlength="6" id="gatePin" placeholder="••••" autofocus/>
    <button class="btn btn-primary" onclick="tentarEntrar()">Entrar</button>
  </div>
</div>

<div class="app" id="app" style="display:none">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="icon">OC</div>
      <div><h1>ObraClara</h1><p>Maternidade Porte I</p></div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-footer">
      <div class="sync" id="syncStatus"><span class="dot"></span><span>Carregando…</span></div>
    </div>
  </aside>

  <div class="main">
    <header class="header">
      <button class="hamburger" onclick="openSidebar()" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="header-title" id="headerTitle">Painel</div>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="app.js"></script>
<script src="pages.js"></script>
</body>
</html>
