<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#2D6A4F"/>
<title>ObraClara — Sistema de Gestão de Obras</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#F8F6F1;--surface:#FFFFFF;--surface-hover:#F0EDE6;--border:#E5E1D8;
  --sidebar:#1A1A2E;--sidebar-hover:rgba(255,255,255,.08);
  --primary:#2D6A4F;--primary-light:#52B788;--primary-pale:#D8F3DC;
  --ok:#2D6A4F;--warn:#E9A84C;--danger:#C1121F;
  --text:#1B1B1B;--text2:#4A4A4A;--text3:#8B8680;--text-inv:#fff;
  --blue:#457B9D;--orange:#E76F51;
  --font-display:'Playfair Display',serif;--font-body:'DM Sans',sans-serif;--font-mono:'JetBrains Mono',monospace;
  --sidebar-w:260px;--header-h:56px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);line-height:1.6;font-size:15px;overflow-x:hidden;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}

/* Layout */
.app{display:flex;min-height:100vh;}
.sidebar{position:fixed;top:0;left:0;height:100vh;width:var(--sidebar-w);background:var(--sidebar);color:var(--text-inv);display:flex;flex-direction:column;z-index:100;transition:transform .3s;}
.sidebar-logo{padding:20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.1);}
.sidebar-logo .icon{width:36px;height:36px;border-radius:10px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;}
.sidebar-logo h1{font-family:var(--font-display);font-size:18px;font-weight:700;line-height:1.2;}
.sidebar-logo p{font-size:10px;opacity:.5;}
.sidebar nav{flex:1;padding:16px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:500;color:rgba(255,255,255,.7);transition:all .2s;cursor:pointer;}
.nav-item:hover{background:var(--sidebar-hover);color:#fff;}
.nav-item.active{background:var(--primary);color:#fff;}
.nav-item svg{width:20px;height:20px;flex-shrink:0;}
.sidebar-footer{padding:12px;border-top:1px solid rgba(255,255,255,.1);}
.main{flex:1;margin-left:var(--sidebar-w);display:flex;flex-direction:column;min-width:0;}

/* Mobile sidebar */
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;}
.hamburger{display:none;align-items:center;justify-content:center;width:40px;height:40px;border-radius:8px;color:var(--text);transition:background .2s;}
.hamburger:hover{background:var(--bg);}
.hamburger svg{width:22px;height:22px;}

/* Header */
.header{height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:40;}
.search-box{position:relative;flex:1;max-width:400px;}
.search-box input{width:100%;padding:8px 12px 8px 36px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:var(--bg);transition:all .2s;}
.search-box input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(45,106,79,.1);}
.search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text3);}
.header-right{display:flex;align-items:center;gap:12px;}
.notif-btn{position:relative;padding:8px;color:var(--text3);border-radius:8px;transition:all .2s;}
.notif-btn:hover{background:var(--bg);color:var(--text);}
.notif-btn .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;background:var(--danger);border-radius:50%;border:2px solid var(--surface);}
.user-info{display:flex;align-items:center;gap:10px;padding-left:12px;border-left:1px solid var(--border);}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--primary-pale);display:flex;align-items:center;justify-content:center;}
.user-avatar svg{width:16px;height:16px;color:var(--primary);}
.user-name{font-size:13px;font-weight:600;}
.user-role{font-size:11px;color:var(--text3);}

/* Content */
.content{padding:16px;}
.page-title{font-family:var(--font-display);font-size:22px;font-weight:700;margin-bottom:4px;}
.page-sub{font-size:13px;color:var(--text3);margin-bottom:20px;}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;transition:box-shadow .2s;}
.card:hover{box-shadow:0 4px 12px rgba(0,0,0,.06);}
.card-title{font-size:15px;font-weight:600;}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px;}
.kpi{display:flex;align-items:flex-start;gap:12px;}
.kpi-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.kpi-icon.green{background:var(--primary-pale);color:var(--primary);}
.kpi-icon.yellow{background:#FFF8E1;color:var(--warn);}
.kpi-icon.red{background:#FFEBEE;color:var(--danger);}
.kpi-icon.blue{background:#E3F2FD;color:var(--blue);}
.kpi-icon svg{width:20px;height:20px;}
.kpi-label{font-size:12px;color:var(--text3);font-weight:500;}
.kpi-value{font-size:24px;font-weight:700;line-height:1.2;margin:2px 0;}
.kpi-sub{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:4px;}
.kpi-sub .up{color:var(--ok);}
.kpi-sub .down{color:var(--danger);}

/* Grid */
.grid-2{display:grid;grid-template-columns:1fr;gap:12px;}
.grid-3{display:grid;grid-template-columns:1fr;gap:12px;}
.grid-4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}

/* Progress */
.progress-bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;}
.progress-bar .fill{height:100%;border-radius:99px;transition:width .5s;}
.progress-sm{height:6px;}

/* Badge */
.badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap;}
.badge-ok{background:var(--primary-pale);color:var(--ok);}
.badge-warn{background:#FFF3CD;color:#856404;}
.badge-danger{background:#FFEBEE;color:var(--danger);}
.badge-blue{background:#E3F2FD;color:var(--blue);}

/* Obra Card */
.obra-card{cursor:pointer;transition:all .2s;}
.obra-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08);}
.obra-card .obra-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;gap:8px;}
.obra-card h3{font-size:15px;font-weight:600;}
.obra-card .obra-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;color:var(--text2);margin-bottom:12px;}
.obra-card .obra-meta span{display:flex;align-items:center;gap:5px;}
.obra-card .obra-meta svg{width:13px;height:13px;color:var(--text3);}
.obra-card .progress-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px;}
.obra-card .progress-label .pct{font-weight:600;}
.obra-card .obra-budget{display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid var(--border);margin-top:10px;}
.obra-card .obra-budget .item small{font-size:10px;color:var(--text3);}
.obra-card .obra-budget .item .val{font-size:13px;font-weight:600;}

/* Table */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;min-width:600px;}
th{text-align:left;padding:10px 12px;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;background:var(--bg);border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:10px 12px;font-size:13px;border-bottom:1px solid rgba(229,225,216,.5);}
tr:hover td{background:var(--surface-hover);}

/* Chart */
.bar-chart{display:flex;flex-direction:column;gap:6px;}
.bar-row{display:flex;align-items:center;gap:8px;}
.bar-label{width:44px;font-size:11px;color:var(--text3);text-align:right;flex-shrink:0;}
.bar-track{flex:1;height:20px;background:var(--bg);border-radius:6px;overflow:hidden;position:relative;}
.bar-track .bar-fill{position:absolute;inset-y:0;left:0;border-radius:6px;transition:width .5s;}
.bar-track .bar-expected{background:rgba(45,106,79,.15);}
.bar-track .bar-actual{background:var(--primary);}
.bar-value{width:36px;font-size:11px;font-family:var(--font-mono);text-align:right;}

/* Despesas */
.donut-list{display:flex;flex-direction:column;gap:10px;}
.donut-item .donut-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;}
.donut-item .donut-bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;}
.donut-item .donut-fill{height:100%;border-radius:99px;}

/* Alert */
.alert{display:flex;gap:10px;padding:14px;border-radius:12px;border-left:4px solid var(--warn);background:#FFFBF0;}
.alert h3{font-size:14px;font-weight:600;margin-bottom:6px;}
.alert ul{list-style:none;display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--text2);}
.alert li{display:flex;align-items:center;gap:6px;}
.alert li svg{width:14px;height:14px;flex-shrink:0;}

/* Buttons */
.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;transition:all .2s;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:#1B4332;}
.btn-outline{border:1.5px solid var(--primary);color:var(--primary);}
.btn-outline:hover{background:var(--primary-pale);}
.btn-sm{padding:6px 12px;font-size:12px;}

/* Stats */
.stat-mini{text-align:center;padding:10px;}
.stat-mini .num{font-size:24px;font-weight:700;}
.stat-mini .label{font-size:11px;color:var(--text3);}

/* Filters */
.filters{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.filters input{padding:8px 12px 8px 36px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:var(--surface);width:100%;max-width:260px;}
.filters input:focus{outline:none;border-color:var(--primary);}

/* Empty state */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;color:var(--text3);text-align:center;}
.empty svg{width:48px;height:48px;margin-bottom:16px;opacity:.4;}
.empty p{font-size:14px;}

/* Page header */
.page-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:4px;}

/* Tarefas counters */
.tarefa-counts{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px;}
.tarefa-counts .card{padding:8px 14px;display:flex;align-items:center;gap:8px;white-space:nowrap;}

/* Financeiro header */
.fin-header{display:flex;flex-wrap:wrap;gap:8px;}

/* Responsive */
@media(min-width:769px){
  .kpi-grid{grid-template-columns:repeat(4,1fr);}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .content{padding:24px;}
  .page-title{font-size:24px;}
}

@media(max-width:768px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-overlay.open{display:block;}
  .hamburger{display:flex;}
  .main{margin-left:0;}
  .header{padding:0 12px;}
  .search-box{max-width:none;}
  .search-box input{font-size:16px;} /* prevent zoom on iOS */
  .user-info .user-name,.user-info .user-role{display:none;}
  .user-info{padding-left:8px;border-left:none;}
  .page-header{flex-direction:column;}
  .page-header .btn{align-self:flex-start;}
  .fin-header{flex-direction:column;}
  .fin-header .btn{width:100%;justify-content:center;}
}
</style>
</head>

const fmt = v => new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v);
const fmtDate = d => {try{return new Date(d+'T12:00:00').toLocaleDateString('pt-BR')}catch(e){return d}};
const diasRest = d => Math.ceil((new Date(d+'T12:00:00')-new Date())/(864e5));

// === NAV ===
const pages = [
  {id:'dashboard',label:'Dashboard',icon:'dashboard'},
  {id:'obras',label:'Obras',icon:'building'},
  {id:'tarefas',label:'Tarefas',icon:'check'},
  {id:'financeiro',label:'Financeiro',icon:'dollar'},
  {id:'equipe',label:'Equipe',icon:'users'},
  {id:'fotos',label:'Fotos',icon:'camera'},
  {id:'materiais',label:'Materiais',icon:'package'},
  {id:'documentos',label:'Documentos',icon:'file'},
  {id:'relatorios',label:'Relatórios',icon:'chart'},
];

let currentPage = 'dashboard';

function renderNav(){
  document.getElementById('nav').innerHTML = pages.map(function(p){
    return '<a class="nav-item '+(currentPage===p.id?'active':'')+'" onclick="navigate(\''+p.id+'\')" href="#">'+
      svg(p.icon)+'<span class="nav-label">'+p.label+'</span></a>';
  }).join('');
}

function navigate(page){
  currentPage = page;
  renderNav();
  renderPage();
  closeSidebar();
  window.scrollTo(0,0);
}

function openSidebar(){
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarOverlay').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
  document.body.style.overflow='';
}

// === PAGES ===
function renderPage(){
  var c = document.getElementById('content');
  switch(currentPage){
    case 'dashboard': c.innerHTML = renderDashboard(); break;
    case 'obras': c.innerHTML = renderObras(); break;
    case 'tarefas': c.innerHTML = renderTarefas(); break;
    case 'financeiro': c.innerHTML = renderFinanceiro(); break;
    default: c.innerHTML = renderGeneric(currentPage);
  }
}

function obraCard(o){
  var dias = diasRest(o.dataEntrega);
  var pStatus = statusPrazo(dias,o.pct);
  var fStatus = statusFin((o.gasto/o.orcamento)*100);
  var gStatus = statusGeral(pStatus,fStatus);
  var badgeLabel = {verde:'No prazo',amarelo:'Atenção',vermelho:'Crítico'}[gStatus];
  var badgeClass = {verde:'badge-ok',amarelo:'badge-warn',vermelho:'badge-danger'}[gStatus];
  var barColor = {verde:'var(--primary)',amarelo:'var(--warn)',vermelho:'var(--danger)'}[gStatus];
  var diasText = dias>0?dias+' dias restantes':dias===0?'Entrega hoje':Math.abs(dias)+' dias atrasado';

  return '<div class="card obra-card" onclick="navigate(\'obras\')">'+
    '<div class="obra-header">'+
      '<div><h3>'+o.nome+'</h3><div style="font-size:12px;color:var(--text3);display:flex;align-items:center;gap:4px;margin-top:2px">'+svg('user',14,14)+' '+o.cliente+'</div></div>'+
      '<span class="badge '+badgeClass+'">'+badgeLabel+'</span>'+
    '</div>'+
    '<div class="obra-meta">'+
      '<span>'+svg('map',13,13)+' '+o.cidade+'</span>'+
      '<span>'+svg('ruler',13,13)+' '+o.area+'m² · '+o.pavimentos+'p</span>'+
      '<span>'+svg('clock',13,13)+' '+o.fase+'</span>'+
      '<span style="color:var(--text3)">'+diasText+'</span>'+
    '</div>'+
    '<div class="progress-label"><span style="color:var(--text3)">Progresso</span><span class="pct">'+o.pct+'%</span></div>'+
    '<div class="progress-bar"><div class="fill" style="width:'+o.pct+'%;background:'+barColor+'"></div></div>'+
    '<div class="obra-budget">'+
      '<div class="item"><small>Orçamento</small><div class="val">'+fmt(o.orcamento)+'</div></div>'+
      '<div class="item" style="text-align:right"><small>Gasto</small><div class="val" style="color:'+(fStatus==='critico'?'var(--danger)':fStatus==='atencao'?'var(--warn)':'var(--text)')+'">'+fmt(o.gasto)+'</div></div>'+
    '</div>'+
  '</div>';
}

function renderDashboard(){
  var ativas = obras.filter(function(o){return o.status==='em_andamento'}).length;
  var tPend = tarefas.filter(function(t){return t.status==='pendente'||t.status==='em_andamento'}).length;
  var tAtras = tarefas.filter(function(t){return t.status==='atrasada'}).length;
  var rec = transacoes.filter(function(t){return t.tipo==='receita'}).reduce(function(s,t){return s+t.valor},0);
  var desp = transacoes.filter(function(t){return t.tipo==='despesa'}).reduce(function(s,t){return s+t.valor},0);
  var saldo = rec-desp;
  var pctMed = Math.round(obras.reduce(function(s,o){return s+o.pct},0)/obras.length);

  return '<h1 class="page-title">Dashboard</h1>'+
    '<p class="page-sub">Visão geral das suas obras e projetos</p>'+
    '<div class="kpi-grid">'+
      '<div class="card"><div class="kpi"><div class="kpi-icon green">'+svg('building')+'</div><div><div class="kpi-label">Obras Ativas</div><div class="kpi-value">'+ativas+'</div><div class="kpi-sub">'+obras.length+' total</div></div></div></div>'+
      '<div class="card"><div class="kpi"><div class="kpi-icon '+(tAtras>0?'yellow':'green')+'">'+svg('check')+'</div><div><div class="kpi-label">Tarefas Pendentes</div><div class="kpi-value">'+tPend+'</div><div class="kpi-sub"><span class="'+(tAtras>0?'down':'up')+'">'+tAtras+' atrasadas</span></div></div></div></div>'+
      '<div class="card"><div class="kpi"><div class="kpi-icon '+(saldo>=0?'green':'red')+'">'+svg('dollar')+'</div><div><div class="kpi-label">Saldo do Mês</div><div class="kpi-value">'+fmt(saldo)+'</div><div class="kpi-sub"><span class="up">↑ 8%</span></div></div></div></div>'+
      '<div class="card"><div class="kpi"><div class="kpi-icon blue">'+svg('up')+'</div><div><div class="kpi-label">Progresso Médio</div><div class="kpi-value">'+pctMed+'%</div><div class="kpi-sub">das obras</div></div></div></div>'+
    '</div>'+
    '<div class="grid-2" style="margin-bottom:20px">'+
      '<div class="card"><div class="card-title" style="margin-bottom:14px">Evolução das Obras</div><div class="bar-chart">'+
        evolucao.map(function(e){
          return '<div class="bar-row"><span class="bar-label">'+e.mes+'</span><div class="bar-track">'+
            '<div class="bar-fill bar-expected" style="width:'+e.prev+'%"></div>'+
            (e.real!==null?'<div class="bar-fill bar-actual" style="width:'+e.real+'%"></div>':'')+
            '</div><span class="bar-value">'+(e.real!=null?e.real:'—')+'%</span></div>';
        }).join('')+
      '</div><div style="display:flex;gap:12px;margin-top:10px;font-size:11px;color:var(--text3)">'+
        '<span><span style="display:inline-block;width:10px;height:10px;background:rgba(45,106,79,.15);border-radius:2px;margin-right:4px"></span>Previsto</span>'+
        '<span><span style="display:inline-block;width:10px;height:10px;background:var(--primary);border-radius:2px;margin-right:4px"></span>Realizado</span>'+
      '</div></div>'+
      '<div class="card"><div class="card-title" style="margin-bottom:14px">Despesas por Categoria</div><div class="donut-list">'+
        despesasCat.map(function(c){
          var total=despesasCat.reduce(function(s,x){return s+x.valor},0);
          var pct=(c.valor/total)*100;
          return '<div class="donut-item"><div class="donut-label"><span>'+c.nome+'</span><span style="font-family:var(--font-mono)">'+fmt(c.valor)+'</span></div>'+
            '<div class="donut-bar"><div class="donut-fill" style="width:'+pct+'%;background:'+c.cor+'"></div></div></div>';
        }).join('')+
      '</div></div>'+
    '</div>'+
    '<h2 style="font-family:var(--font-display);font-size:17px;font-weight:700;margin-bottom:14px">Obras em Andamento</h2>'+
    '<div class="grid-3" style="margin-bottom:20px">'+obras.slice(0,3).map(obraCard).join('')+'</div>'+
    '<div class="alert">'+svg('alert')+'<div><h3>Alertas e Atenção</h3><ul>'+
      '<li>'+svg('clock',14,14)+' <strong>Forro drywall</strong> (Reforma Escritório Tech) — 70% concluído, prazo era 25/01</li>'+
      '<li>'+svg('dollar',14,14)+' <strong>Placas drywall + perfis</strong> — R$ 7.800 em atraso</li>'+
      '<li>'+svg('dollar',14,14)+' <strong>Reforma Escritório Tech</strong> — Orçamento ultrapassado em 8%</li>'+
    '</ul></div></div>';
}

function renderTarefas(){
  var counts = {
    pendente:tarefas.filter(function(t){return t.status==='pendente'}).length,
    em_andamento:tarefas.filter(function(t){return t.status==='em_andamento'}).length,
    concluida:tarefas.filter(function(t){return t.status==='concluida'}).length,
    atrasada:tarefas.filter(function(t){return t.status==='atrasada'}).length,
  };
  var statusIcon = function(s){return {concluida:'<span style="color:var(--ok)">✓</span>',em_andamento:'<span style="color:var(--blue)">◷</span>',atrasada:'<span style="color:var(--danger)">⚠</span>',pendente:'<span style="color:var(--text3)">○</span>'}[s]};
  var priorBadge = function(p){return {critica:'badge-danger',alta:'badge-warn',media:'badge-blue',baixa:''}[p]};
  var priorLabel = function(p){return {critica:'Crítica',alta:'Alta',media:'Média',baixa:'Baixa'}[p]};

  return '<div class="page-header">'+
    '<div><h1 class="page-title">Tarefas</h1><p class="page-sub">Acompanhe todas as atividades das obras</p></div>'+
    '<button class="btn btn-primary">'+svg('plus',16,16)+' Nova Tarefa</button>'+
  '</div>'+
  '<div class="tarefa-counts">'+
    [{l:'Pendentes',c:counts.pendente,cl:'var(--text3)'},{l:'Em Andamento',c:counts.em_andamento,cl:'var(--blue)'},{l:'Concluídas',c:counts.concluida,cl:'var(--ok)'},{l:'Atrasadas',c:counts.atrasada,cl:'var(--danger)'}].map(function(s){
      return '<div class="card"><span style="font-size:18px;font-weight:700;color:'+s.cl+'">'+s.c+'</span><span style="font-size:12px;color:var(--text3)">'+s.l+'</span></div>';
    }).join('')+
  '</div>'+
  '<div class="card" style="padding:0;overflow:hidden"><div class="table-wrap"><table>'+
    '<thead><tr><th>Status</th><th>Tarefa</th><th>Obra</th><th>Responsável</th><th>Prioridade</th><th>Prazo</th><th>Progresso</th></tr></thead>'+
    '<tbody>'+tarefas.map(function(t){
      var obra = obras.find(function(o){return o.id===t.obraId});
      var barCl = t.status==='concluida'?'var(--ok)':t.status==='atrasada'?'var(--danger)':'var(--primary)';
      return '<tr><td>'+statusIcon(t.status)+'</td>'+
        '<td><div style="font-weight:500">'+t.titulo+'</div><div style="font-size:11px;color:var(--text3)">'+t.fase+'</div></td>'+
        '<td style="color:var(--text2)">'+(obra?obra.nome:'')+'</td>'+
        '<td style="color:var(--text2)">'+t.resp+'</td>'+
        '<td><span class="badge '+priorBadge(t.prioridade)+'">'+priorLabel(t.prioridade)+'</span></td>'+
        '<td style="font-size:12px;color:var(--text3)">'+fmtDate(t.fim)+'</td>'+
        '<td><div style="display:flex;align-items:center;gap:6px"><div class="progress-bar progress-sm" style="width:56px"><div class="fill" style="width:'+t.pct+'%;background:'+barCl+'"></div></div><span style="font-size:11px;color:var(--text3)">'+t.pct+'%</span></div></td>'+
      '</tr>';
    }).join('')+'</tbody></table></div></div>';
}

function renderFinanceiro(){
  var rec = transacoes.filter(function(t){return t.tipo==='receita'}).reduce(function(s,t){return s+t.valor},0);
  var desp = transacoes.filter(function(t){return t.tipo==='despesa'}).reduce(function(s,t){return s+t.valor},0);
  var saldo = rec-desp;

  return '<div class="page-header">'+
    '<div><h1 class="page-title">Financeiro</h1><p class="page-sub">Controle de receitas, despesas e fluxo de caixa</p></div>'+
    '<div class="fin-header"><button class="btn btn-outline">'+svg('down',16,16)+' Nova Receita</button><button class="btn btn-primary">'+svg('up',16,16)+' Nova Despesa</button></div>'+
  '</div>'+
  '<div class="grid-3" style="margin-bottom:20px">'+
    '<div class="card" style="border-left:4px solid var(--ok)"><div class="kpi"><div class="kpi-icon green">'+svg('up')+'</div><div><div class="kpi-label">Total Receitas</div><div class="kpi-value" style="color:var(--ok)">'+fmt(rec)+'</div></div></div></div>'+
    '<div class="card" style="border-left:4px solid var(--danger)"><div class="kpi"><div class="kpi-icon red">'+svg('down')+'</div><div><div class="kpi-label">Total Despesas</div><div class="kpi-value" style="color:var(--danger)">'+fmt(desp)+'</div></div></div></div>'+
    '<div class="card" style="border-left:4px solid var(--primary)"><div class="kpi"><div class="kpi-icon blue">'+svg('dollar')+'</div><div><div class="kpi-label">Saldo</div><div class="kpi-value" style="color:'+(saldo>=0?'var(--ok)':'var(--danger)')+'">'+fmt(saldo)+'</div></div></div></div>'+
  '</div>'+
  '<div class="grid-2">'+
    '<div class="card" style="padding:0"><div style="padding:14px;border-bottom:1px solid var(--border)"><div class="card-title">Últimas Transações</div></div><div class="table-wrap"><table>'+
      '<thead><tr><th>Tipo</th><th>Descrição</th><th>Obra</th><th>Data</th><th>Status</th><th style="text-align:right">Valor</th></tr></thead>'+
      '<tbody>'+transacoes.sort(function(a,b){return new Date(b.data)-new Date(a.data)}).map(function(tx){
        var obra=obras.find(function(o){return o.id===tx.obraId});
        var isRec=tx.tipo==='receita';
        var statusCl=tx.status==='pago'?'badge-ok':tx.status==='atrasado'?'badge-danger':'badge-warn';
        var statusLabel=tx.status==='pago'?'Pago':tx.status==='atrasado'?'Atrasado':'Pendente';
        return '<tr><td><span style="color:'+(isRec?'var(--ok)':'var(--danger)')+';font-weight:600;font-size:11px">'+(isRec?'↑ Receita':'↓ Despesa')+'</span></td>'+
          '<td>'+tx.desc+'</td>'+
          '<td style="font-size:11px;color:var(--text2)">'+(obra?obra.nome:'')+'</td>'+
          '<td style="font-size:11px;color:var(--text3)">'+fmtDate(tx.data)+'</td>'+
          '<td><span class="badge '+statusCl+'">'+statusLabel+'</span></td>'+
          '<td style="text-align:right;font-family:var(--font-mono);font-weight:600;color:'+(isRec?'var(--ok)':'var(--danger)')+'">'+(isRec?'+':'−')+fmt(tx.valor)+'</td></tr>';
      }).join('')+'</tbody></table></div></div>'+
    '<div class="card"><div class="card-title" style="margin-bottom:14px">Despesas por Categoria</div><div class="donut-list">'+
      despesasCat.map(function(c){
        var pct=(c.valor/desp)*100;
        return '<div class="donut-item"><div class="donut-label"><span>'+c.nome+'</span><span style="font-family:var(--font-mono);font-weight:600">'+fmt(c.valor)+'</span></div>'+
          '<div class="donut-bar"><div class="donut-fill" style="width:'+pct+'%;background:'+c.cor+'"></div></div>'+
          '<div style="font-size:10px;color:var(--text3);text-align:right">'+pct.toFixed(1)+'%</div></div>';
      }).join('')+
    '</div><div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border);display:flex;justify-content:space-between">'+
      '<span style="font-weight:600;font-size:14px">Total Despesas</span>'+
      '<span style="font-weight:700;color:var(--danger)">'+fmt(desp)+'</span>'+
    '</div></div>'+
  '</div>';
}

function renderGeneric(name){
  var titles = {equipe:'Equipe',fotos:'Fotos',materiais:'Materiais',documentos:'Documentos',relatorios:'Relatórios'};
  return '<h1 class="page-title">'+(titles[name]||name)+'</h1>'+
    '<p class="page-sub">Módulo em desenvolvimento</p>'+
    '<div class="empty">'+
      svg(name==='equipe'?'users':name==='fotos'?'camera':name==='materiais'?'package':'chart')+
      '<p>Este módulo será implementado na próxima sprint.</p>'+
      '<button class="btn btn-outline" style="margin-top:16px" onclick="navigate(\'dashboard\')">Voltar ao Dashboard</button>'+
    '</div>';
}

// === INIT ===
renderNav();
renderPage();
</script>
