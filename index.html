<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#2D6A4F"/>
<title>ObraClara — Maternidade Porte I</title>
<link rel="manifest" href="manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#F8F6F1;--surface:#FFFFFF;--surface-hover:#F0EDE6;--border:#E5E1D8;
  --sidebar:#1A1A2E;--sidebar-hover:rgba(255,255,255,.08);
  --primary:#2D6A4F;--primary-light:#52B788;--primary-pale:#D8F3DC;
  --ok:#2D6A4F;--warn:#E9A84C;--danger:#C1121F;
  --text:#1B1B1B;--text2:#4A4A4A;--text3:#8B8680;--text-inv:#fff;
  --blue:#457B9D;--orange:#E76F51;
  --font-display:'Playfair Display',serif;--font-body:'DM Sans',sans-serif;--font-mono:'JetBrains Mono',monospace;
  --sidebar-w:260px;--header-h:56px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);line-height:1.6;font-size:15px;overflow-x:hidden;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,select,textarea{font-family:inherit;font-size:14px;}

/* Layout */
.app{display:flex;min-height:100vh;}
.sidebar{position:fixed;top:0;left:0;height:100vh;width:var(--sidebar-w);background:var(--sidebar);color:var(--text-inv);display:flex;flex-direction:column;z-index:100;transition:transform .3s;}
.sidebar-logo{padding:20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.1);}
.sidebar-logo .icon{width:36px;height:36px;border-radius:10px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;}
.sidebar-logo h1{font-family:var(--font-display);font-size:17px;font-weight:700;line-height:1.2;}
.sidebar-logo p{font-size:10px;opacity:.5;}
.sidebar nav{flex:1;padding:16px 12px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:500;color:rgba(255,255,255,.7);transition:all .2s;cursor:pointer;}
.nav-item:hover{background:var(--sidebar-hover);color:#fff;}
.nav-item.active{background:var(--primary);color:#fff;}
.nav-item svg{width:20px;height:20px;flex-shrink:0;}
.sidebar-footer{padding:12px;border-top:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:4px;}
.sidebar-footer .sync{font-size:11px;color:rgba(255,255,255,.45);padding:6px 12px;display:flex;align-items:center;gap:6px;}
.sidebar-footer .sync .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}
.main{flex:1;margin-left:var(--sidebar-w);display:flex;flex-direction:column;min-width:0;}

/* Mobile sidebar */
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;}
.hamburger{display:none;align-items:center;justify-content:center;width:40px;height:40px;border-radius:8px;color:var(--text);transition:background .2s;}
.hamburger:hover{background:var(--bg);}
.hamburger svg{width:22px;height:22px;}

/* Header */
.header{height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:40;}
.header-title{flex:1;font-size:14px;font-weight:600;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.header-right{display:flex;align-items:center;gap:12px;margin-left:auto;}
.user-info{display:flex;align-items:center;gap:10px;padding-left:12px;border-left:1px solid var(--border);}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--primary-pale);display:flex;align-items:center;justify-content:center;}
.user-avatar svg{width:16px;height:16px;color:var(--primary);}
.user-name{font-size:13px;font-weight:600;}
.user-role{font-size:11px;color:var(--text3);}

/* Content */
.content{padding:16px;}
.page-title{font-family:var(--font-display);font-size:22px;font-weight:700;margin-bottom:4px;}
.page-sub{font-size:13px;color:var(--text3);margin-bottom:20px;}
.page-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:4px;}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;}
.card-title{font-size:15px;font-weight:600;}

/* KPI bar (os 4 números, sempre no topo) */
.kpi-bar{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px;}
.kpi-tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;position:relative;overflow:hidden;}
.kpi-tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tone,var(--border));}
.kpi-tile .k-label{font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
.kpi-tile .k-value{font-family:var(--font-mono);font-size:22px;font-weight:700;line-height:1.25;margin-top:3px;letter-spacing:-.02em;}
.kpi-tile .k-note{font-size:11.5px;color:var(--text3);margin-top:3px;}
.kpi-tile.ok{--tone:var(--ok);}
.kpi-tile.warn{--tone:var(--warn);}
.kpi-tile.danger{--tone:var(--danger);}
.kpi-frase{background:var(--primary-pale);border-radius:10px;padding:12px 14px;font-size:13.5px;color:#1B4332;margin-bottom:20px;line-height:1.55;}
.kpi-frase strong{font-weight:700;}

/* Pills / badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap;}
.badge-ok{background:var(--primary-pale);color:var(--ok);}
.badge-warn{background:#FFF3CD;color:#856404;}
.badge-danger{background:#FFEBEE;color:var(--danger);}
.badge-blue{background:#E3F2FD;color:var(--blue);}
.badge-neutral{background:var(--bg);color:var(--text3);}

/* Grid */
.grid-2{display:grid;grid-template-columns:1fr;gap:12px;}
.grid-3{display:grid;grid-template-columns:1fr;gap:12px;}
.grid-4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}

/* Progress */
.progress-bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;}
.progress-bar .fill{height:100%;border-radius:99px;transition:width .5s;}
.progress-sm{height:6px;}

/* Forms */
.form-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:10px;}
.fgroup label{display:block;font-size:11.5px;font-weight:600;color:var(--text3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px;}
.fgroup input,.fgroup select,.fgroup textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);}
.fgroup input:focus,.fgroup select:focus,.fgroup textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(45,106,79,.1);}
.fgroup textarea{resize:vertical;min-height:60px;}

/* Buttons */
.btn{padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:#1B4332;}
.btn-outline{border:1.5px solid var(--primary);color:var(--primary);}
.btn-outline:hover{background:var(--primary-pale);}
.btn-danger-outline{border:1.5px solid var(--danger);color:var(--danger);}
.btn-danger-outline:hover{background:#FFEBEE;}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-icon{padding:6px;border-radius:6px;color:var(--text3);}
.btn-icon:hover{background:var(--bg);color:var(--danger);}

/* Table */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;min-width:520px;}
th{text-align:left;padding:10px 12px;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;background:var(--bg);border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:10px 12px;font-size:13px;border-bottom:1px solid rgba(229,225,216,.5);}
tr:hover td{background:var(--surface-hover);}
td.n,th.n{text-align:right;font-family:var(--font-mono);white-space:nowrap;}
tr.tot td{font-weight:700;background:var(--bg);}

/* Chart bars (curva, composição) */
.bar-chart{display:flex;flex-direction:column;gap:6px;}
.bar-row{display:flex;align-items:center;gap:8px;}
.bar-label{width:56px;font-size:11px;color:var(--text3);text-align:right;flex-shrink:0;font-family:var(--font-mono);}
.bar-track{flex:1;height:20px;background:var(--bg);border-radius:6px;overflow:hidden;position:relative;}
.bar-track .bar-fill{position:absolute;inset-y:0;left:0;border-radius:6px;transition:width .5s;}
.bar-track .bar-expected{background:rgba(45,106,79,.18);}
.bar-track .bar-actual{background:var(--primary);}
.bar-track .bar-proj{background:repeating-linear-gradient(135deg,var(--blue),var(--blue) 4px,transparent 4px,transparent 8px);opacity:.55;}
.bar-value{width:40px;font-size:11px;font-family:var(--font-mono);text-align:right;flex-shrink:0;}
.legend-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--text3);}
.legend-row span{display:flex;align-items:center;gap:5px;}
.legend-row i{width:10px;height:10px;border-radius:2px;display:inline-block;flex-shrink:0;}

/* Composição stack */
.stack{display:flex;width:100%;height:36px;border-radius:8px;overflow:hidden;margin-bottom:10px;}
.stack span{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;}

/* Lote progress */
.lote-row{padding:12px 0;border-bottom:1px solid var(--border);}
.lote-row:last-child{border-bottom:none;}
.lote-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;}
.lote-head b{font-weight:700;}
.lote-head .meta{color:var(--text3);font-size:11.5px;}

/* Alert */
.alert{display:flex;gap:10px;padding:14px;border-radius:12px;border-left:4px solid var(--warn);background:#FFFBF0;margin-bottom:16px;}
.alert.danger{border-left-color:var(--danger);background:#FFF2F1;}
.alert h3{font-size:14px;font-weight:600;margin-bottom:4px;}
.alert p{font-size:12.5px;color:var(--text2);}

/* Empty state */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;color:var(--text3);text-align:center;}
.empty svg{width:40px;height:40px;margin-bottom:12px;opacity:.4;}
.empty p{font-size:13px;}

/* Restrições board */
.restr-card{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;border-left:4px solid var(--border);}
.restr-card.aberta{border-left-color:var(--danger);}
.restr-card.andamento{border-left-color:var(--warn);}
.restr-card.liberada{border-left-color:var(--ok);opacity:.7;}
.restr-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:4px;}
.restr-top b{font-size:13.5px;}
.restr-meta{font-size:11.5px;color:var(--text3);display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;}

/* PPC */
.ppc-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
.ppc-row:last-child{border-bottom:none;}
.ppc-week{font-family:var(--font-mono);width:70px;color:var(--text3);flex-shrink:0;}

/* Simulador */
.sim-slider{margin-bottom:18px;}
.sim-slider .sl-head{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px;}
.sim-slider .sl-head b{font-family:var(--font-mono);color:var(--primary);font-size:14px;}
.sim-slider input[type=range]{width:100%;accent-color:var(--primary);}
.sim-result{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.sim-result .sr-item{background:var(--bg);border-radius:10px;padding:12px;}
.sim-result .sr-item .l{font-size:10.5px;color:var(--text3);text-transform:uppercase;font-weight:600;letter-spacing:.3px;}
.sim-result .sr-item .v{font-family:var(--font-mono);font-size:18px;font-weight:700;margin-top:2px;}

/* Toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--text);color:#fff;padding:11px 20px;border-radius:99px;font-size:13px;font-weight:600;z-index:200;transition:transform .25s;box-shadow:0 8px 24px rgba(0,0,0,.2);}
#toast.show{transform:translateX(-50%) translateY(0);}

/* Login gate */
.gate{position:fixed;inset:0;background:var(--sidebar);display:flex;align-items:center;justify-content:center;z-index:500;padding:20px;}
.gate-box{background:var(--surface);border-radius:16px;padding:32px 28px;width:100%;max-width:340px;text-align:center;}
.gate-box .icon{width:52px;height:52px;border-radius:14px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;margin:0 auto 16px;font-size:18px;}
.gate-box h2{font-family:var(--font-display);font-size:19px;margin-bottom:4px;}
.gate-box p{font-size:12.5px;color:var(--text3);margin-bottom:18px;}
.gate-box input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;text-align:center;font-size:20px;letter-spacing:6px;margin-bottom:12px;font-family:var(--font-mono);}
.gate-box input:focus{outline:none;border-color:var(--primary);}
.gate-box .btn{width:100%;padding:12px;}
.gate-box .err{color:var(--danger);font-size:12px;margin-bottom:10px;min-height:16px;}

/* Responsive */
@media(min-width:769px){
  .kpi-bar{grid-template-columns:repeat(4,1fr);}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .content{padding:24px;}
  .page-title{font-size:24px;}
  .form-grid{grid-template-columns:repeat(3,1fr);}
  .form-grid.cols2{grid-template-columns:1fr 1fr;}
  .sim-result{grid-template-columns:repeat(4,1fr);}
}

@media(max-width:768px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-overlay.open{display:block;}
  .hamburger{display:flex;}
  .main{margin-left:0;}
  .header{padding:0 12px;}
  .user-info .user-name,.user-info .user-role{display:none;}
  .user-info{padding-left:8px;border-left:none;}
  .page-header{flex-direction:column;}
  .page-header .btn{align-self:flex-start;}
}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-box">
    <div class="icon">OC</div>
    <h2>ObraClara</h2>
    <p>Maternidade Porte I — acesso da equipe MSE</p>
    <div class="err" id="gateErr"></div>
    <input type="password" inputmode="numeric" maxlength="6" id="gatePin" placeholder="••••" autofocus/>
    <button class="btn btn-primary" onclick="tentarEntrar()">Entrar</button>
  </div>
</div>

<div class="app" id="app" style="display:none">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="icon">OC</div>
      <div class="logo-text"><h1>ObraClara</h1><p>Maternidade Porte I</p></div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-footer">
      <div class="sync" id="syncStatus"><span class="dot"></span><span>Carregando…</span></div>
      <div class="nav-item" onclick="closeSidebar()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
        <span class="nav-label">Fechar</span>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="header">
      <button class="hamburger" onclick="openSidebar()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="header-title" id="headerTitle">Maternidade Porte I</div>
      <div class="header-right">
        <div class="user-info">
          <div class="user-avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
          <div><div class="user-name">Equipe MSE</div><div class="user-role">Sr. Rafael · Maternidade</div></div>
        </div>
      </div>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="app.js"></script>
<script src="pages.js"></script>
</body>
</html>
